<!DOCTYPE html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#059669">
<title>가계부</title>
<style>
:root{--bg:#F2F0F7;--card:#FFFFFF;--text:#1E2230;--sub:#6B6F80;--line:#E6E3EE;--chip:#EFEDF5;--accent:#059669;--accent-soft:#D9F5EA;--danger:#DC2626;--warn:#EA8A0C;--income:#2563EB;--shadow:0 6px 20px rgba(76,64,120,.08);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);color-scheme:light}
html[data-theme=dark]{--bg:#15141B;--card:#211F2A;--text:#F2F2F5;--sub:#A4A3B2;--line:#34313F;--chip:#2D2A38;--accent:#10B981;--accent-soft:#0B3B2D;--danger:#F87171;--warn:#FBBF24;--income:#60A5FA;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){html[data-theme=auto]{--bg:#15141B;--card:#211F2A;--text:#F2F2F5;--sub:#A4A3B2;--line:#34313F;--chip:#2D2A38;--accent:#10B981;--accent-soft:#0B3B2D;--danger:#F87171;--warn:#FBBF24;--income:#60A5FA;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#view{max-width:560px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(130px + var(--safe-b))}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin:0 0 14px}
.card h3{margin:0 0 12px;font-size:19px}
.sub{color:var(--sub);font-size:15px}
p{margin:6px 0}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.arrow{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:30px;line-height:1;padding:0 0 4px}
.mlabel{border:0;background:none;font-size:22px;font-weight:800;min-height:52px}
.big-amt{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--chip);border-radius:16px;padding:12px}
.kpi small{display:block;color:var(--sub);font-size:15px}
.kpi b{font-size:22px}
.up{color:var(--danger);font-weight:700}.down{color:var(--accent);font-weight:700}
.income{color:var(--income)}
.bar{height:14px;border-radius:99px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--danger)}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.tx:last-child{border-bottom:0}
.tx-ic{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.tx-ic img{width:100%;height:100%;object-fit:cover}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main small{display:block;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-size:22px;font-weight:800;white-space:nowrap}
.tx-amt em{font-style:normal;font-size:15px;font-weight:600;margin-left:1px}
.dayhead{display:flex;justify-content:space-between;gap:8px;margin:0 0 2px;font-size:16px;font-weight:700;color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;min-height:46px;padding:0 16px;border-radius:999px;border:0;background:var(--chip);font-size:16px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:16px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:48px;border:0;border-radius:12px;background:none;font-weight:700;font-size:17px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}
.btn{min-height:52px;border-radius:16px;border:0;padding:0 18px;font-size:18px;font-weight:700;background:var(--chip)}
.btn.primary{background:var(--accent);color:#fff}
.btn.red{background:var(--danger);color:#fff}
.btn.redline{background:none;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{min-height:44px;font-size:16px;padding:0 14px;border-radius:12px;flex:0 0 auto}
.btn.full{width:100%}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input:not([type=radio]):not([type=checkbox]):not([type=file]),select,textarea{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-size:18px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date]{display:block}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:180px;resize:vertical;line-height:1.45}
.fl{display:block;margin:14px 0 0;font-weight:700;font-size:16px;color:var(--sub)}
.fl>input,.fl>select,.fl>.amtbox,.fl>.chips{margin-top:6px}
.amtbox{display:flex;align-items:center;gap:8px}
.amtbox input{font-size:26px!important;font-weight:800;text-align:right;color:var(--text)}
.amtbox span{font-size:22px;font-weight:700;color:var(--text)}
.notice{border-radius:14px;padding:12px 14px;font-size:16px;margin:10px 0;background:var(--accent-soft)}
.notice.warn{background:rgba(245,158,11,.18)}
.notice.error{background:rgba(239,68,68,.16)}
.photo{display:block;width:100%;border:0;padding:0;background:#000;border-radius:16px;overflow:hidden;position:relative;margin:8px 0}
.photo img{display:block;width:100%;max-height:260px;object-fit:contain}
.photo span{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;padding:4px 10px;border-radius:99px}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
#tabbar .in{pointer-events:auto;width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);box-shadow:0 -4px 20px rgba(60,50,100,.10);border-radius:22px 22px 0 0;padding:6px 6px calc(6px + var(--safe-b))}
.tab{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;color:var(--sub);font-weight:700}
.tab .ti{font-size:24px;line-height:1}
.tab.on{color:var(--accent)}
.plus{justify-self:center;width:70px;height:70px;border-radius:50%;border:5px solid var(--bg);background:var(--accent);color:#fff;font-size:40px;line-height:1;transform:translateY(-22px);box-shadow:0 8px 20px rgba(5,150,105,.4);display:flex;align-items:center;justify-content:center;padding:0}
#sheetWrap{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(20,16,40,.45)}
#sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 18px calc(28px + var(--safe-b));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sheet-head h3{margin:0;font-size:21px}
.x{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:0;background:var(--chip);font-size:20px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:14px;border-radius:99px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.menu4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.menu4 button{min-height:112px;border:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.menu4 .em{font-size:34px}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0}
.hint{font-size:15px;color:var(--sub);margin:8px 2px 0}
#zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:var(--safe-t) 0 var(--safe-b)}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
#loading{position:fixed;inset:0;z-index:70;background:rgba(20,16,40,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;text-align:center;padding:20px;font-size:19px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(104px + var(--safe-b));transform:translate(-50%,20px);z-index:95;background:rgba(30,30,40,.94);color:#fff;padding:14px 18px;border-radius:16px;font-size:16px;width:max-content;max-width:min(90vw,500px);opacity:0;pointer-events:none;transition:.25s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock-in{width:100%;max-width:340px;text-align:center}
.lock-ic{font-size:44px}
.dots{display:flex;justify-content:center;gap:18px;margin:18px 0 6px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.dots i.f{background:var(--accent)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pinmsg{min-height:26px;color:var(--danger);font-size:16px;margin:0 0 8px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{height:72px;border-radius:20px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:28px;font-weight:700}
.keypad .blank{visibility:hidden}
.linkbtn{border:0;background:none;color:var(--sub);font-size:16px;margin:14px 6px 0;min-height:44px;text-decoration:underline}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:14px;color:var(--sub);padding:2px 0}
.cal .wd:first-child{color:var(--danger)}
.day{aspect-ratio:1/1.2;border:0;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 1px;font-size:15px;min-width:0;color:var(--text)}
.day small{font-size:11px;font-weight:800;margin-top:auto;margin-bottom:2px;white-space:nowrap;letter-spacing:-.3px}
.day.sel{outline:3px solid var(--text);outline-offset:-1px}
.day.today b{text-decoration:underline}
.day.empty{background:none;pointer-events:none}
.donut-wrap{position:relative;width:240px;height:240px;margin:0 auto}
.donut-wrap svg{width:100%;height:100%}
.donut-center{position:absolute;inset:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;line-height:1.3}
.donut-center b{font-size:19px}
.donut-center .amt{font-size:22px;font-weight:800}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.legend button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 6px;border-radius:12px;text-align:left;min-height:50px;width:100%}
.legend button.on{background:var(--chip)}
.legend .nm{flex:1;min-width:0}
.dot{width:14px;height:14px;border-radius:4px;flex:0 0 14px}
.stack{display:flex;height:24px;border-radius:99px;overflow:hidden;background:var(--chip);margin:6px 0 10px}
.rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .no{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-msg{color:var(--sub);text-align:center;padding:22px 0}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .grow{flex:1;min-width:0}
.radio{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600}
.radio input{width:24px;height:24px;accent-color:var(--accent);flex:0 0 24px}
.pagetitle{font-size:26px;margin:10px 2px 14px}
.banner{background:linear-gradient(135deg,#059669,#10B981);color:#fff}
.banner .sub{color:#E7FFF5}
.svgtxt{fill:var(--sub);font-size:12px}
.svgval{fill:var(--text);font-size:11px;font-weight:700}
</style>
</head>
<body>
<main id="view"></main>

<nav id="tabbar"><div class="in">
  <button class="tab" data-act="tab" data-tab="home"><span class="ti">🏠</span>홈</button>
  <button class="tab" data-act="tab" data-tab="list"><span class="ti">📋</span>내역</button>
  <button class="plus" data-act="plus" aria-label="기록 추가">＋</button>
  <button class="tab" data-act="tab" data-tab="stats"><span class="ti">📊</span>통계</button>
  <button class="tab" data-act="tab" data-tab="settings"><span class="ti">⚙️</span>설정</button>
</div></nav>

<div id="sheetWrap" hidden><div class="backdrop" data-act="closeSheet"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="zoom" hidden data-act="zoomClose"><img alt="크게 보기"></div>
<div id="loading" hidden><div class="spin"></div><div id="loadingText">잠시만 기다려 주세요…</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="lock" hidden><div class="lock-in">
  <div class="lock-ic">🔒</div>
  <p id="pinTitle" style="font-size:20px;font-weight:700">PIN 4자리를 입력해 주세요</p>
  <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <p id="pinMsg" class="pinmsg"></p>
  <div class="keypad">
    <button data-act="pin" data-k="1">1</button><button data-act="pin" data-k="2">2</button><button data-act="pin" data-k="3">3</button>
    <button data-act="pin" data-k="4">4</button><button data-act="pin" data-k="5">5</button><button data-act="pin" data-k="6">6</button>
    <button data-act="pin" data-k="7">7</button><button data-act="pin" data-k="8">8</button><button data-act="pin" data-k="9">9</button>
    <button class="blank" tabindex="-1"></button><button data-act="pin" data-k="0">0</button><button data-act="pin" data-k="del" aria-label="지우기">⌫</button>
  </div>
  <button id="pinCancel" class="linkbtn" data-act="pinCancel">취소</button>
  <button id="pinForgot" class="linkbtn" data-act="pinForgot">PIN을 잊었어요</button>
</div></div>

<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fPick" accept="image/*" multiple hidden>
<input type="file" id="fCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= 기본 도구 ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseYmd=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+Number(n));
const WD=['일','월','화','수','목','금','토'];
const fmtDate=s=>{const d=parseYmd(s);return isNaN(d)?String(s):`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;};
const ymOf=s=>String(s||'').slice(0,7);
const curYM=()=>today().slice(0,7);
function addMonth(ym,k){let [y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m);}
const ymLabel=ym=>{const [y,m]=ym.split('-');return `${y}년 ${Number(m)}월`;};
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const comma=n=>Math.round(Number(n)||0).toLocaleString('ko-KR');
const won=n=>comma(n)+'원';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function short(n){n=Math.round(n||0);if(n>=10000)return (Math.round(n/1000)/10).toString().replace(/\.0$/,'')+'만';if(n>=1000)return (Math.round(n/100)/10).toString().replace(/\.0$/,'')+'천';return String(n);}
function ro(w){w=String(w);const c=w.charCodeAt(w.length-1);if(!(c>=0xAC00&&c<=0xD7A3))return '(으)로';const j=(c-0xAC00)%28;return (j===0||j===8)?'로':'으로';}
const isValidYmd=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(parseYmd(s));

/* SHA-256 (PIN 저장용) */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  const mp=Math.pow,maxWord=mp(2,32);let result='';const words=[];const bitLen=ascii.length*8;
  let hash=[];const k=[];let pc=0;const comp={};
  for(let cand=2;pc<64;cand++){if(!comp[cand]){for(let i=0;i<313;i+=cand)comp[i]=cand;hash[pc]=(mp(cand,.5)*maxWord)|0;k[pc++]=(mp(cand,1/3)*maxWord)|0;}}
  hash=hash.slice(0,8);
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((bitLen/maxWord)|0);words[words.length]=bitLen;
  for(let j=0;j<words.length;){const w=words.slice(j,j+=16);const old=hash;hash=hash.slice(0,8);
    for(let i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}
    for(let i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0;}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;
}

function kwCat(s){s=String(s||'');for(const [c,re] of KW){if(re.test(s)&&cats('expense').some(x=>x.n===c))return c;}return null;}
function learnedCat(merchant,type){const k=mkey(merchant);const v=k&&DB.settings.learn[k];return v&&cats(type).some(c=>c.n===v)?v:null;}
function guessCat(merchant,type,extra=''){
  const L=learnedCat(merchant,type);if(L)return L;
  if(type==='income'){const s=merchant+' '+extra;if(/급여|월급|상여|보너스/.test(s))return pickCat('급여','income');if(/용돈/.test(s))return pickCat('용돈','income');return pickCat('기타수입','income');}
  return kwCat(merchant+' '+extra)||pickCat('기타','expense');
}
function learnCat(rec){
  const k=mkey(rec.merchant);if(!k||k===mkey(rec.cat))return;
  const L=DB.settings.learn;const prev=L[k];if(prev===rec.cat)return;
  L[k]=rec.cat;
  const auto=rec.type==='income'?guessCat('', 'income',rec.merchant):(kwCat(rec.merchant)||pickCat('기타','expense'));
  if(prev||auto!==rec.cat)toast(`앞으로 ‘${rec.merchant}’은(는) ${rec.cat}${ro(rec.cat)} 자동 분류해요`);
}

/* ================= 한 줄 입력 읽기 ================= */
const KD={'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9};
const KU={'십':10,'백':100,'천':1000};
function korNum(str){
  const s=String(str).replace(/[,\s원]/g,'');if(!s)return null;
  let total=0,section=0,cur=0,has=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;cur=parseFloat(s.slice(i,j));if(isNaN(cur))return null;i=j-1;has=true;continue;}
    if(KD[ch]){cur=KD[ch];has=true;continue;}
    if(KU[ch]){section+=(cur||1)*KU[ch];cur=0;has=true;continue;}
    if(ch==='만'){total+=((section+cur)||1)*10000;section=0;cur=0;has=true;continue;}
    if(ch==='억'){total+=((section+cur)||1)*1e8;section=0;cur=0;has=true;continue;}
    return null;
  }
  return has?Math.round(total+section+cur):null;
}
function findAmount(s){
  const re=/[0-9일이삼사오육칠팔구십백천만억][0-9일이삼사오육칠팔구십백천만억,.]*(?:\s*원)?/g;let m;const cands=[];
  while((m=re.exec(s))){
    const txt=m[0];const hasWon=/원$/.test(txt);const core=txt.replace(/\s*원$/,'');const hasDigit=/[0-9]/.test(core);
    const v=korNum(core);if(v==null||v<=0)continue;
    if(!hasDigit){
      const prev=s[m.index-1]||' ';if(/[가-힣]/.test(prev))continue;
      if(v<100)continue;
      if(!hasWon&&!(core.length>=2&&/[십백천만억]/.test(core)))continue;
    }
    const pri=hasWon&&hasDigit?0:hasWon?1:hasDigit?2:3;
    cands.push({v,idx:m.index,len:txt.length,pri});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>a.pri-b.pri||(a.pri===2?b.v-a.v:a.idx-b.idx));
  return cands[0];
}
function mdDate(mo,d){if(!(mo>=1&&mo<=12&&d>=1&&d<=31))return null;const now=new Date();let dt=new Date(now.getFullYear(),mo-1,d);if(dt>new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59))dt=new Date(now.getFullYear()-1,mo-1,d);return dt;}
function parseLine(input){
  let s=' '+String(input).trim()+' ';const now=new Date();let date=today();
  const setD=d=>{if(d&&!isNaN(d))date=ymd(d);};
  const take=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.replace(m[0],' ');return true;}return false;};
  take(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/,m=>setD(new Date(+m[1],m[2]-1,+m[3])))||
  take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/,m=>setD(mdDate(+m[1],+m[2])))||
  take(/(\d{1,2})\/(\d{1,2})/,m=>setD(mdDate(+m[1],+m[2])))||
  take(/(\d+)\s*일\s*전/,m=>setD(addDays(now,-m[1])))||
  take(/그저께|그제/,()=>setD(addDays(now,-2)))||
  take(/어제/,()=>setD(addDays(now,-1)))||
  take(/오늘/,()=>{})||
  take(/지난\s*주?\s*([월화수목금토일])요일/,m=>{const w=WD.indexOf(m[1]);let k=(now.getDay()-w+7)%7;if(k===0)k=7;setD(addDays(now,-k));});
  const type=/월급|용돈|입금|받았어|급여|보너스|상여/.test(s)?'income':'expense';
  let payment=null;
  if(/현금/.test(s))payment='현금';
  else if(/계좌\s*이체|이체|송금/.test(s))payment='계좌이체';
  else if(/카카오\s*페이|네이버\s*페이|토스\s*페이|페이코|삼성\s*페이|애플\s*페이|간편\s*결제/.test(s))payment='간편결제';
  else if(/카드/.test(s))payment='카드';
  if(!payment)payment=type==='income'?'계좌이체':'카드';
  s=s.replace(/현금|계좌\s*이체|이체|송금|카카오\s*페이|네이버\s*페이|토스\s*페이|페이코|삼성\s*페이|애플\s*페이|간편\s*결제|(?:신용|체크)?\s*카드/g,' ');
  let amount=null;const a=findAmount(s);
  if(a){amount=a.v;s=s.slice(0,a.idx)+' '+s.slice(a.idx+a.len);}
  const memo=[];s=s.replace(/아침|점심|저녁|야식|브런치|간식/g,m=>{memo.push(m);return ' ';});
  const FILLER=/^(원|썼어요?|썼음|썼다|샀어요?|샀음|결제|결제함|결제했어요?|냈어요?|지불|했어요?|하고|그리고|및|받았어요?|받았음|받음|들어옴|에서|으로|로|에|을|를)$/;
  const tokens=s.split(/\s+/).filter(Boolean).map(t=>{
    let x=t.replace(/[.,!?~]+$/,'');
    const m=x.match(/^(.+?)(에서|으로|에게|한테|께|에|을|를)$/);if(m&&m[1].length>=2)x=m[1];
    else if(/로$/.test(x)&&x.length>=3)x=x.slice(0,-1);
    return x;}).filter(t=>t&&!FILLER.test(t));
  const merchant=tokens.join(' ').trim().slice(0,40);
  const cat=guessCat(merchant,type,memo.join(' ')+' '+input);
  return {type,date,merchant,amount,cat,payment,memo:memo.join(' '),source:'quick'};
}

const BANKS='KB국민|KB|국민|신한|삼성|현대|롯데|하나|우리|비씨|BC|NH농협|NH|농협|씨티|IBK기업|IBK|기업|카카오뱅크|카카오|토스뱅크|토스|케이뱅크|K뱅크|수협|광주|전북|경남|부산|대구|DGB|BNK|제주|SC제일|SC|우체국|새마을금고|새마을|신협|산업|하나SK';
const RE_CARDCO=new RegExp('(?:'+BANKS+')\\s*(?:체크카드|신용카드|카드|체크|은행|뱅크)','g');
const RE_BANKTOK=new RegExp('^(?:'+BANKS+')$');
function splitSms(text){return String(text).replace(/\r/g,'').split(/\n\s*\n|(?=\[Web발신\])/).map(x=>x.replace(/\[Web발신\]/g,'').trim()).filter(Boolean);}
const LABELS=/(누적|잔액|잔고|한도|포인트|적립|가능|사용가능|이용가능)(금액)?$/;
function smsAmount(msg){
  const re=/([0-9][0-9,]*)\s*원/g;let m;
  while((m=re.exec(msg))){const before=msg.slice(Math.max(0,m.index-12),m.index).replace(/[\s:：]+$/,'');if(LABELS.test(before))continue;const v=parseInt(m[1].replace(/,/g,''),10);if(v>0)return v;}
  const m2=msg.match(/(?:금액|승인)\s*[:：]?\s*([0-9][0-9,]{2,})(?!\s*원)/);if(m2){const v=parseInt(m2[1].replace(/,/g,''),10);if(v>0)return v;}
  return null;
}
function smsDate(msg){
  let m=msg.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);if(m){const d=new Date(+m[1],m[2]-1,+m[3]);if(!isNaN(d))return ymd(d);}
  m=msg.match(/(?:^|[^\d])(\d{1,2})\/(\d{1,2})(?!\d)/);if(m){const d=mdDate(+m[1],+m[2]);if(d)return ymd(d);}
  m=msg.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){const d=mdDate(+m[1],+m[2]);if(d)return ymd(d);}
  return today();
}
function smsMerchant(msg){
  let s=' '+msg+' ';
  s=s.replace(/\(주\)|㈜|주식회사/g,' ');
  s=s.replace(/(누적|잔액|잔고|한도|포인트|적립|사용가능|이용가능|가능)(금액)?\s*[:：]?\s*[0-9,]+\s*원?/g,' ');
  s=s.replace(/\[[^\]]{1,15}\]/g,' ');
  s=s.replace(RE_CARDCO,' ');
  s=s.replace(/\(?\d+\*[\d*]*\)?|\(?\*+\d[\d*]*\)?|\(\d{2,4}\)/g,' ');
  s=s.replace(/\d{2,}-[\d*\-]{3,}/g,' ');
  s=s.replace(/[가-힣A-Za-z]{0,3}\*[가-힣A-Za-z*]{0,3}\s*님?/g,' ');
  s=s.replace(/[가-힣]{2,4}님/g,' ');
  s=s.replace(/(USD|US\$|EUR|JPY|CNY|GBP)\s*[0-9.,]+|[0-9.,]+\s*(USD|달러|EUR|유로|JPY|엔화)/gi,' ');
  s=s.replace(/[0-9][0-9,]*\s*원/g,' ');
  s=s.replace(/\d{4}[\/.\-]\d{1,2}[\/.\-]\d{1,2}|\d{1,2}\/\d{1,2}|\d{1,2}:\d{2}(:\d{2})?|\d{1,2}월\s*\d{1,2}일/g,' ');
  s=s.replace(/승인취소|승인|취소|환불|일시불|할부\s*\d*\s*(개월)?|\d+\s*개월|체크카드|신용카드|체크|신용|결제|이용|사용|금액|국내|해외|현금영수증|입금|출금|이체|송금|받았어요|보냈어요|받았습니다|보냈습니다|정상|완료|Web발신/g,' ');
  s=s.replace(/[\[\]()<>|:：,'"]/g,' ');
  const toks=s.split(/\s+/).filter(t=>t&&!/^[\d.,*\-\/~]+$/.test(t)&&!RE_BANKTOK.test(t)&&t!=='원'&&t!=='님');

/* ================= 반복 결제 감지 · 고정지출 ================= */
function detectRecurring(){
  const s=DB.settings;const fromYM=addMonth(curYM(),-5);
  const recKeys=new Set(s.recurring.map(r=>mkey(r.name)));const ign=new Set(s.ignoredRec.map(x=>x.k));
  const groups={};
  DB.tx.forEach(t=>{if(t.type!=='expense'||t.source==='recurring'||ymOf(t.date)<fromYM||!(t.amount>0))return;const k=mkey(t.merchant);if(!k||recKeys.has(k)||ign.has(k))return;(groups[k]=groups[k]||[]).push(t);});
  const out=[];
  for(const [k,list] of Object.entries(groups)){
    const byM={};list.forEach(t=>{const m=ymOf(t.date);(byM[m]=byM[m]||[]).push(t);});
    const months=Object.keys(byM).sort();let hit=null;
    const runs=[];let run=[];
    months.forEach(m=>{if(byM[m].length!==1){if(run.length)runs.push(run);run=[];return;}if(run.length&&addMonth(run[run.length-1],1)!==m){runs.push(run);run=[];}run.push(m);});
    if(run.length)runs.push(run);
    runs.forEach(r=>{if(r.length<3)return;const ts=r.map(m=>byM[m][0]);const am=ts.map(t=>t.amount),ds=ts.map(t=>+t.date.slice(8));
      if(Math.max(...am)-Math.min(...am)<=Math.max(...am)*0.1&&Math.max(...ds)-Math.min(...ds)<=6)hit=ts;});
    if(!hit){for(let i=1;i<months.length;i++){const a=byM[months[i-1]],b=byM[months[i]];if(addMonth(months[i-1],1)===months[i]&&a.length===1&&b.length===1&&a[0].amount===b[0].amount)hit=[a[0],b[0]];}}
    if(hit){const last=hit[hit.length-1];out.push({key:k,name:last.merchant,amount:last.amount,day:+last.date.slice(8),cat:last.cat,payment:last.payment,count:hit.length,lastDate:last.date});}
  }
  return out.sort((a,b)=>b.lastDate.localeCompare(a.lastDate)).slice(0,3);
}
function applyRecurring(){
  const td=today(),cym=curYM();let added=0;
  DB.settings.recurring.forEach(r=>{
    if(!Array.isArray(r.done))r.done=[];
    const created=ymd(new Date(r.createdAt||Date.now()));
    const dueIn=ym=>{const [y,m]=ym.split('-').map(Number);return ym+'-'+pad(Math.min(r.day,daysIn(y,m)));};
    let ym=created.slice(0,7);if(dueIn(ym)<created)ym=addMonth(ym,1);
    let guard=0;
    while(ym<=cym&&guard++<240){
      const due=dueIn(ym);
      if(due<=td&&!r.done.includes(ym)){
        r.done.push(ym);
        const k=mkey(r.name);
        const already=DB.tx.some(t=>t.type==='expense'&&ymOf(t.date)===ym&&t.amount===r.amount&&similar(mkey(t.merchant),k));
        if(!already){DB.tx.push({id:uid(),type:'expense',date:due,merchant:r.name,amount:r.amount,cat:r.cat,payment:r.payment||'카드',memo:'고정지출 자동 기록',source:'recurring',recurId:r.id,createdAt:Date.now()});added++;}
      }
      ym=addMonth(ym,1);
    }
  });
  save();
  if(added)toast(`🔁 고정지출 ${added}건을 자동으로 기록했어요`);
}

/* ================= 입력 대기열 · 확인 화면 ================= */
let Q=[],qTotal=0,F=null;
function startQueue(items){Q=items.slice();qTotal=items.length;nextInQueue();}
async function nextInQueue(){
  while(Q.length){
    const it=Q.shift();let d=it;
    if(it.loader){try{d=await it.loader();}catch(e){d={skip:errMsg(e)};}finally{hideLoading();}}
    if(!d||d.skip){if(d&&d.skip)toast(d.skip);continue;}
    if(d.cancelTarget){openCancel(d);return;}
    openForm(d);return;
  }
  closeSheet();render();
}
function openForm(d,edit=false){
  F={d:Object.assign({type:'expense',date:today(),merchant:'',amount:null,cat:'',payment:'카드',memo:'',source:'manual'},d),edit};
  if(!isValidYmd(F.d.date))F.d.date=today();
  if(!F.d.cat)F.d.cat=guessCat(F.d.merchant,F.d.type);
  drawForm(false);
}

function budgetCheck(r){

let pinBuf='',pinMode=null,pinFirst='',hiddenAt=0;
function showPin(mode){pinMode=mode;pinBuf='';const T={unlock:'PIN 4자리를 입력해 주세요',set1:'새 PIN 4자리를 입력해 주세요',set2:'확인을 위해 한 번 더 입력해 주세요',off:'지금 쓰는 PIN을 입력해 주세요'};$('#pinTitle').textContent=T[mode];$('#pinMsg').textContent='';$('#pinCancel').hidden=mode==='unlock';$('#pinForgot').hidden=mode!=='unlock';$('#lock').hidden=false;drawDots();}

async function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(/iP(hone|ad|od)|Android/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
const csvCell=v=>{let s=String(v==null?'':v);if(typeof v==='string'&&/^[=+\-@\t]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
function parseCSV(text){const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}}if(f||row.length){row.push(f);rows.push(row);}return rows;}
function normDate(s){s=String(s||'').trim();const m=s.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/);if(!m)return null;const d=new Date(+m[1],m[2]-1,+m[3]);return isNaN(d)?null:ymd(d);}
function importCSV(text){
  text=text.replace(/^﻿/,'');const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()));if(!rows.length){toast('CSV 파일이 비어 있어요');return;}
  const hd=rows[0].map(h=>String(h).trim());const idx=(...names)=>hd.findIndex(h=>names.includes(h));
  let I={date:idx('날짜','date'),type:idx('구분','type'),mer:idx('사용처','merchant','내용'),amt:idx('금액','amount'),cat:idx('카테고리','cat','분류'),pay:idx('결제수단','payment'),memo:idx('메모','memo')};
  let start=1;if(I.date<0||I.amt<0){I={date:0,type:1,mer:2,amt:3,cat:4,pay:5,memo:6};start=normDate(rows[0][0])?0:1;}
  const un=v=>String(v==null?'':v).replace(/^'(?=[=+\-@\t])/,'').trim();
  let n=0,bad=0,dup=0;
  for(let i=start;i<rows.length;i++){const r=rows[i];const date=normDate(r[I.date]);const raw=String(r[I.amt]||'');let amount=parseInt(raw.replace(/[^0-9]/g,''),10);
    if(!date||!(amount>0)){bad++;continue;}
    const tv=un(r[I.type]);let type=/수입|income/i.test(tv)?'income':(/지출|expense/i.test(tv)?'expense':(/^-/.test(raw.trim())?'expense':'expense'));
    const merchant=un(r[I.mer]).slice(0,60);let cat=un(r[I.cat]);if(!cats(type).some(c=>c.n===cat))cat=guessCat(merchant,type);
    let payment=un(r[I.pay]);if(!PAYS.includes(payment))payment=type==='income'?'계좌이체':'카드';
    const t={id:uid(),type,date,merchant:merchant||cat,amount,cat,payment,memo:I.memo>=0?un(r[I.memo]).slice(0,200):'',source:'import',createdAt:Date.now()+i};
    if(DB.tx.some(x=>x.date===t.date&&x.amount===t.amount&&x.type===t.type&&x.merchant===t.merchant)){dup++;continue;}
    DB.tx.push(t);n++;}
  save();render();toast(`${n}건을 가져왔어요${dup?` · 이미 있는 ${dup}건 건너뜀`:''}${bad?` · 읽지 못한 ${bad}줄`:''}`);
}

function makeIcon(size){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,'#10B981');g.addColorStop(1,'#047857');x.fillStyle=g;x.fillRect(0,0,size,size);
  x.fillStyle='rgba(255,255,255,.95)';const r=size*0.1,w=size*0.62,h=size*0.44,X=(size-w)/2,Y=size*0.3;x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.fill();
  x.fillStyle='#059669';x.font=`800 ${size*0.3}px -apple-system,"Apple SD Gothic Neo",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('₩',size/2,Y+h/2+size*0.01);return c.toDataURL('image/png');}

      if(!(p.amount>0)&&!p.fx&&aiReady()){items.push({loader:async()=>{showLoading('AI에게 문자 내용을 물어보는 중…');try{const a=aiToDraft(parseAIJson(await callAI(smsPrompt(maskSms(p.raw)))));if(a.amount)p.amount=a.amount;if(a.merchant&&!p.merchant)p.merchant=a.merchant;if(!learnedCat(p.merchant,p.type)&&p.type==='expense')p.cat=a.cat;if(!p.amount){p.notice='금액을 읽지 못했어요. 직접 넣어 주세요.';p.noticeType='warn';}}catch(e){p.notice='금액을 읽지 못했어요. '+errMsg(e);p.noticeType='warn';}return p;}});return;}
      if(!(p.amount>0)){p.notice=p.fx?'외화 결제예요. 카드사에서 원화로 청구된 금액을 직접 넣어 주세요.':'금액을 읽지 못했어요. 직접 넣어 주세요.';p.noticeType='warn';}
      items.push(p);});
    if(!items.length){toast(`읽을 수 있는 결제 문자가 없어요${skipped?` (건너뛴 문자 ${skipped}건)`:''}`);return;}
    toast(`문자 ${items.length}건을 찾았어요${skipped?` · ${skipped}건은 건너뛰었어요`:''}`);
    startQueue(items);
  },
  quickGo:()=>{const el=$('#quickIn');if(!el)return;const v=el.value.trim();if(!v){toast('예) 어제 점심 12000원 김밥천국 처럼 적어 주세요');el.focus();return;}
    const d=parseLine(v);if(!d.amount){d.notice='금액을 읽지 못했어요. 금액을 직접 넣어 주세요.';d.noticeType='warn';}
    Q=[];qTotal=0;openForm(d);},
  fType:el=>{syncForm();F.d.type=el.dataset.v;F.d.cat=guessCat(F.d.merchant,F.d.type);if(F.d.type==='income'&&F.d.payment==='카드')F.d.payment='계좌이체';drawForm();},
  fCat:el=>{syncForm();F.d.cat=el.dataset.v;drawForm();},
  fPay:el=>{syncForm();F.d.payment=el.dataset.v;drawForm();},
  fSave:()=>saveForm(),
  fSkip:()=>{F=null;nextInQueue();},
  fDel:()=>{if(!confirm('이 내역을 삭제할까요?'))return;DB.tx=DB.tx.filter(t=>t.id!==F.d.id);save();toast('삭제했어요');closeSheet();render();},
  fCancelSave:()=>{const id=F.cancel.id;DB.tx=DB.tx.filter(t=>t.id!==id);save();toast('취소 문자로 기존 내역을 지웠어요');F=null;nextInQueue();},
  zoom:()=>{const src=F&&(F.d.photo||F.d.thumb);if(!src)return;$('#zoom img').src=src;$('#zoom').hidden=false;},
  zoomClose:()=>{$('#zoom').hidden=true;$('#zoom img').removeAttribute('src');},
  theme:el=>{DB.settings.theme=el.dataset.v;save();applyTheme();render();},
  recReg:el=>{const r=detectRecurring().find(x=>x.key===el.dataset.k);if(!r)return;DB.settings.recurring.push({id:uid(),name:r.name,amount:r.amount,day:r.day,cat:r.cat,payment:r.payment,createdAt:Date.now(),done:[]});save();applyRecurring();toast(`‘${r.name}’을(를) 고정지출로 등록했어요`);render();},
  recIgn:el=>{const r=detectRecurring().find(x=>x.key===el.dataset.k);DB.settings.ignoredRec.push({k:el.dataset.k,n:r?r.name:el.dataset.k});save();toast('다시 보이지 않게 했어요 (설정에서 되돌릴 수 있어요)');render();},
  recUnignore:el=>{DB.settings.ignoredRec=DB.settings.ignoredRec.filter(x=>x.k!==el.dataset.k);save();render();},
  editCatBudget:()=>{const b=DB.settings.budgets;openSheet(head('카테고리별 예산')+`<p class="sub">비워 두면 그 카테고리는 예산을 쓰지 않아요.</p>${cats('expense').map(c=>`<label class="fl">${esc(c.e)} ${esc(c.n)}<div class="amtbox"><input data-cb="${esc(c.n)}" data-money inputmode="numeric" placeholder="0" value="${b[c.n]?comma(b[c.n]):''}"><span>원</span></div></label>`).join('')}<div class="btns"><button class="btn primary" data-act="saveCatBudget">저장</button></div>`);},
  saveCatBudget:()=>{const b={};document.querySelectorAll('[data-cb]').forEach(el=>{const v=parseInt(el.value.replace(/[^0-9]/g,''),10);if(v>0)b[el.dataset.cb]=v;});DB.settings.budgets=b;save();closeSheet();toast('카테고리 예산을 저장했어요');render();},
  addRec:()=>openSheet(head('고정지출·구독 추가')+`<label class="fl">이름<input id="rName" type="text" autocomplete="off" placeholder="예) 넷플릭스, 월세"></label><label class="fl">금액<div class="amtbox"><input id="rAmt" data-money inputmode="numeric" placeholder="0"><span>원</span></div></label><label class="fl">매월 며칠에 나가나요?<select id="rDay">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${i+1===new Date().getDate()?'selected':''}>${i+1}일</option>`).join('')}</select></label><label class="fl">카테고리<select id="rCat">${cats('expense').map(c=>`<option value="${esc(c.n)}">${esc(c.e)} ${esc(c.n)}</option>`).join('')}</select></label><label class="fl">결제수단<select id="rPay">${PAYS.map(p=>`<option>${p}</option>`).join('')}</select></label><p class="sub">날짜가 지나면 앱을 열 때 자동으로 기록돼요. 오늘보다 앞선 날짜면 다음 달부터 기록돼요. 그달에 없는 날(31일 등)은 말일에 기록해요.</p><div class="btns"><button class="btn primary" data-act="saveRec">추가</button></div>`),
  saveRec:()=>{const name=$('#rName').value.trim().slice(0,40);const amount=parseInt($('#rAmt').value.replace(/[^0-9]/g,''),10);if(!name){toast('이름을 적어 주세요');return;}if(!(amount>0)){toast('금액을 입력해 주세요');return;}
    DB.settings.recurring.push({id:uid(),name,amount,day:+$('#rDay').value,cat:$('#rCat').value,payment:$('#rPay').value,createdAt:Date.now(),done:[]});save();closeSheet();applyRecurring();toast('고정지출을 추가했어요');render();},
  delRec:el=>{if(!confirm('이 고정지출을 삭제할까요?\n(이미 기록된 내역은 그대로 남아요)'))return;DB.settings.recurring=DB.settings.recurring.filter(r=>r.id!==el.dataset.id);save();render();},
  manageCats:()=>drawCats(),
  catTab:el=>{state.catTab=el.dataset.v;drawCats();},
  delCat:el=>{const t=state.catTab,n=el.dataset.n;const l=cats(t);if(l.length<=1){toast('카테고리는 하나 이상 있어야 해요');return;}if(!confirm(`‘${n}’ 카테고리를 삭제할까요?\n(이미 기록된 내역은 그대로 남아요)`))return;DB.settings.cats[t]=l.filter(c=>c.n!==n);delete DB.settings.budgets[n];save();drawCats();render();},
  addCat:()=>{const e=($('#cEmoji').value.trim()||'📌').slice(0,4);const n=$('#cName').value.trim().replace(/[<>]/g,'').slice(0,12);if(!n){toast('이름을 적어 주세요');return;}if([...cats('expense'),...cats('income')].some(c=>c.n===n)){toast('같은 이름의 카테고리가 이미 있어요');return;}DB.settings.cats[state.catTab].push({e,n});save();toast(`‘${n}’ 카테고리를 추가했어요`);drawCats();render();},
  learnDel:el=>{delete DB.settings.learn[el.dataset.k];save();render();},
  testConn:async()=>{syncSettingsInputs();const s=DB.settings;showLoading('연결을 확인하는 중…');
    try{if(s.ocr==='tesseract'){await loadTess();toast('✅ 기기 내 글자 인식 도구를 불러왔어요');}else{await callAI('연결 테스트입니다. {"ok":true} 라는 JSON 하나만 출력하세요.');toast('✅ 연결 성공! 영수증을 읽을 준비가 됐어요');}}
    catch(e){toast('❌ '+errMsg(e));}finally{hideLoading();}},
  pinSet:()=>showPin('set1'),
  pinOff:()=>showPin('off'),
  pin:el=>{const k=el.dataset.k;$('#pinMsg').textContent='';if(k==='del'){pinBuf=pinBuf.slice(0,-1);drawDots();return;}if(pinBuf.length>=4)return;pinBuf+=k;drawDots();if(pinBuf.length===4){const v=pinBuf;setTimeout(()=>pinDone(v),150);}},
  pinCancel:()=>{$('#lock').hidden=true;},
  pinForgot:()=>{if(!confirm('PIN을 잊으면 잠금을 풀 수 없어요.\n모든 데이터를 지우고 처음부터 시작할까요?'))return;if(!confirm('정말 모든 데이터를 지울까요? 되돌릴 수 없어요.'))return;localStorage.removeItem(KEY);load();save();applyTheme();$('#lock').hidden=true;render();toast('모든 데이터를 지웠어요');},
  csvOut:()=>{if(!DB.tx.length){toast('내보낼 내역이 없어요');return;}const rows=[['날짜','구분','사용처','금액','카테고리','결제수단','메모','입력방식']];sortTx(DB.tx).forEach(t=>rows.push([t.date,t.type==='income'?'수입':'지출',t.merchant,Number(t.amount)||0,t.cat,t.payment,t.memo||'',SRC[t.source]||t.source||'']));downloadFile(`가계부_${today()}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');},
  csvIn:()=>$('#fCsv').click(),
  jsonOut:()=>{const st=Object.assign({},DB.settings,{geminiKey:'',claudeKey:''});downloadFile(`가계부_백업_${today()}.json`,JSON.stringify({app:'gagyebu',version:1,exportedAt:new Date().toISOString(),tx:DB.tx,settings:st}),'application/json');},
  jsonIn:()=>$('#fJson').click(),
  sampleIn:()=>{if(DB.tx.some(t=>t.sample)&&!confirm('샘플 데이터가 이미 있어요. 더 넣을까요?'))return;addSample();},
  sampleOut:()=>{const n=DB.tx.filter(t=>t.sample).length;if(!n){toast('지울 샘플 데이터가 없어요');return;}DB.tx=DB.tx.filter(t=>!t.sample);save();toast(`샘플 ${n}건을 지웠어요`);render();},
  wipe:()=>{if(!confirm('정말 모든 데이터를 지울까요?\n내역·예산·설정이 모두 사라져요.'))return;if(!confirm('한 번 더 확인할게요.\n지운 데이터는 되돌릴 수 없어요. 정말 지울까요?'))return;localStorage.removeItem(KEY);load();save();applyTheme();state.month=curYM();toast('모든 데이터를 지웠어요');render();}
};
function openPlus(){Q=[];qTotal=0;F=null;openSheet(head('무엇으로 기록할까요?')+`<div class="quick"><input id="quickIn" type="text" enterkeyhint="done" autocomplete="off" placeholder="예) 어제 점심 12000원 김밥천국"><button class="btn primary" data-act="quickGo">등록</button></div><p class="hint">🎤 키보드의 마이크 버튼을 누르고 말하면 글자로 바뀌어요</p><div class="menu4"><button data-act="camera"><span class="em">📷</span>영수증 촬영</button><button data-act="pick"><span class="em">🖼️</span>사진·캡처 불러오기</button><button data-act="sms"><span class="em">💬</span>카드 문자 붙여넣기</button><button data-act="manual"><span class="em">✏️</span>직접 입력</button></div>`);}
function drawCats(){const t=state.catTab;openSheet(head('카테고리 관리')+`<div class="seg"><button class="${t==='expense'?'on':''}" data-act="catTab" data-v="expense">지출</button><button class="${t==='income'?'on':''}" data-act="catTab" data-v="income">수입</button></div><div class="card">${cats(t).map(c=>`<div class="li"><span style="font-size:24px">${esc(c.e)}</span><div class="grow"><b>${esc(c.n)}</b></div><button class="btn small redline" data-act="delCat" data-n="${esc(c.n)}">삭제</button></div>`).join('')}</div><div class="card"><h3>＋ 새 ${t==='expense'?'지출':'수입'} 카테고리</h3><div style="display:flex;gap:8px"><input id="cEmoji" type="text" placeholder="🐶" style="width:80px;flex:0 0 80px;text-align:center" autocomplete="off"><input id="cName" type="text" placeholder="예) 반려동물" autocomplete="off"></div><div class="btns"><button class="btn primary" data-act="addCat">추가</button></div></div>`,true);}

async function recognize(f,i,n){
  const tag=n>1?` (${i}/${n})`:'';showLoading('사진을 준비하는 중…'+tag);
  let big,thumb;try{({big,thumb}=await processImage(f));}catch(e){return {skip:'사진을 열 수 없어요. 다른 사진으로 해 보세요.'};}
  const d={type:'expense',date:today(),merchant:'',amount:null,cat:'',payment:'카드',memo:'',source:'receipt',thumb,photo:big};
  const mode=DB.settings.ocr;
  if(mode==='none'){d.notice='인식 방식이 ‘사용 안 함’이에요. 사진을 보며 직접 입력해 주세요. (설정 → 영수증 인식 방식에서 바꿀 수 있어요)';d.noticeType='info';}
  else if(mode==='tesseract'){
    try{setLoading('글자 인식 도구를 불러오는 중…'+tag);const text=await ocrLocal(big,p=>setLoading(`글자를 읽는 중… ${p}%`+tag));Object.assign(d,parseOcrText(text));d.notice='기기 안에서 글자를 읽었어요. 정확도가 낮을 수 있으니 꼭 확인해 주세요.';d.noticeType='warn';}
    catch(e){d.notice=errMsg(e)+' 사진을 보면서 직접 입력해 주세요.';d.noticeType='error';}
  } else {
    try{setLoading('AI가 영수증을 읽는 중…'+tag);const a=aiToDraft(parseAIJson(await callAI(receiptPrompt(),big.split(',')[1])));Object.assign(d,a);
      if(!a.amount){d.notice='금액을 읽지 못했어요. 사진을 보며 넣어 주세요.';d.noticeType='warn';}
      else if(a.confidence!=null&&a.confidence<0.6){d.notice='AI가 확신하지 못했어요. 값을 꼭 확인해 주세요.';d.noticeType='warn';}}
    catch(e){d.notice=errMsg(e)+' 사진을 보면서 직접 입력해 주세요.';d.noticeType='error';}
  }
  if(!d.cat)d.cat=guessCat(d.merchant,'expense');
  return d;
}
function handlePhotos(files){files=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name));if(!files.length){toast('사진 파일을 골라 주세요');return;}const n=files.length;startQueue(files.map((f,i)=>({loader:()=>recognize(f,i+1,n)})));}

/* ================= 이벤트 연결 ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset&&el.dataset.money!==undefined){const v=el.value.replace(/[^0-9]/g,'').slice(0,12);el.value=v?Number(v).toLocaleString('ko-KR'):'';}
  if(el.id==='q'){state.q=el.value;renderListBody();}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset&&el.dataset.set){setSetting(el);return;}
  if(el.name==='ocr'){syncSettingsInputs();DB.settings.ocr=el.value;save();render();return;}
  if(el.id==='fDate'&&F){syncForm();drawForm();return;}
  if(el.id==='fCam'||el.id==='fPick'){const fs=el.files;if(fs&&fs.length)handlePhotos(fs);el.value='';return;}
  if(el.id==='fCsv'&&el.files[0]){const fl=el.files[0];el.value='';fl.text().then(importCSV).catch(()=>toast('파일을 읽지 못했어요'));return;}
  if(el.id==='fJson'&&el.files[0]){const fl=el.files[0];el.value='';fl.text().then(t=>{let j;try{j=JSON.parse(t);}catch(err){toast('백업 파일이 올바르지 않아요');return;}
    if(!j||!Array.isArray(j.tx)||!j.settings){toast('가계부 백업 파일이 아니에요');return;}
    if(!confirm(`백업 파일의 내역 ${j.tx.length}건으로 지금 데이터를 바꿀까요?\n(지금 데이터는 사라져요)`))return;
    const keep={geminiKey:DB.settings.geminiKey,claudeKey:DB.settings.claudeKey};DB={tx:j.tx.filter(t=>t&&t.id&&isValidYmd(t.date)),settings:Object.assign({},j.settings,keep)};
    localStorage.setItem(KEY,JSON.stringify(DB));load();save();applyTheme();toast('백업을 복원했어요');render();}).catch(()=>toast('파일을 읽지 못했어요'));}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&e.target.id==='quickIn'){e.preventDefault();ACT.quickGo();}
  if(e.key==='Escape'){if(!$('#zoom').hidden)ACT.zoomClose();else if(!$('#sheetWrap').hidden)closeSheet();}});

/* ================= 시작 ================= */
load();applyTheme();setupIcons();applyRecurring();render();
if(DB.settings.pinHash)showPin('unlock');
</script>
